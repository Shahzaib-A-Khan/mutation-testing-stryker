name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  strong-tests:
    name: Strong tests meet the mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run test
      - run: npm run coverage
      - name: Run Stryker (fails below 90%)
        run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  weak-tests:
    name: Weak tests must fail the gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - name: Run Stryker on the weak tests (the gate must fire)
        run: |
          set +e
          npm run mutation:weak
          code=$?
          echo "Stryker exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "The weak tests passed the gate, so the gate proves nothing."
            exit 1
          fi
      - name: Check the weak score and the survivors
        run: node scripts/verify-weak.mjs